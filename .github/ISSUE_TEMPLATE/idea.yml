name: 💡 Idea or wish
description: A new feature, level, character, or something that would make the game more fun
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you love to see in Thornwild?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be fun?
